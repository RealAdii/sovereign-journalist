name: CI

on:
  push:
    branches: [main, sepolia-rewrite]
  pull_request:

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dashes
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_STARKNET_NETWORK: sepolia
          NEXT_PUBLIC_STARKNET_CHAIN_ID: SN_SEPOLIA

  e2e:
    name: Browser flow tests (mocked backend)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  contracts:
    name: Cairo build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.14.0"
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: "0.57.0"
      - run: scarb build
      - run: snforge test

  sepolia-readonly:
    name: Sepolia read-only compatibility check
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sepolia
        env:
          NEXT_PUBLIC_STRK20_POOL_ADDRESS: "0x0254a6b2997ef52e9f830ce1f543f6b29768295e8d17e2267d672c552cfe0d91"
          NEXT_PUBLIC_ARTICLE_REGISTRY_ADDRESS: ${{ vars.SEPOLIA_ARTICLE_REGISTRY_ADDRESS }}
